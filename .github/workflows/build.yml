name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PinchGrab-Windows
          - os: macos-latest # Apple Silicon (M1 and newer)
            artifact: PinchGrab-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download hand model
        run: curl -L -o hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task

      - name: Build
        run: pyinstaller --noconfirm pinchgrab.spec

      - name: Self-test and zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/PinchGrab/PinchGrab.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          Compress-Archive -Path dist/PinchGrab -DestinationPath ${{ matrix.artifact }}.zip

      - name: Self-test and zip (Mac)
        if: runner.os == 'macOS'
        run: |
          dist/PinchGrab.app/Contents/MacOS/PinchGrab --selftest
          # ditto keeps the .app bundle's symlinks and permissions intact.
          ditto -c -k --keepParent dist/PinchGrab.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
